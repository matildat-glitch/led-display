<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Animation Editor</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --led-on: #ffffff;
            --led-off: #2a2a2a;
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --secondary: #FFB300;
            --panel-bg-width: 500px;
            --digits-gap: 0px;
            --digits-overlap: -5px;
            --digits-edge-offset: 40px;
            --digits-shift-x: 0px;
            --digits-shift-y: 0px;
            --icons-gap: 14px;
            --icons-inner-gap: 8px;
            --left-icons-gap: 14px;
            --left-icons-inner-gap: 8px;
            --icon-scale: 0.9;
            --icon-shift-x: 0px;
            --icon-shift-y: 25px;
            --left-icon-scale: 1;
            --left-icon-shift-x: 0px;
            --left-icon-shift-y: 0px;
            --icon-left-loading-width: 44px;
            --icon-left-loading-height: 44px;
            --icon-left-loading-scale: 1.2;
            --icon-left-loading-shift-x: -7px;
            --icon-left-loading-shift-y: -34px;
            --loading-body-on: #f3ba3f;
            --loading-dot-on: #ffffff;
            --loading-body-off: #6b5522;
            --loading-dot-off: #6a6a6a;
            --icon-left-accucheck-width: 44px;
            --icon-left-accucheck-height: 44px;
            --icon-left-accucheck-scale: 1.2;
            --icon-left-accucheck-shift-x: -7px;
            --icon-left-accucheck-shift-y: -16px;
            --accucheck-body-on: #69ba9f;
            --accucheck-mark-on: #ffffff;
            --accucheck-body-off: #2f5347;
            --accucheck-mark-off: #6a6a6a;
            --icon-left-lowbattery-width: 44px;
            --icon-left-lowbattery-height: 22px;
            --icon-left-lowbattery-scale: 1;
            --icon-left-lowbattery-shift-x: -3px;
            --icon-left-lowbattery-shift-y: 17px;
            --center-icons-shift-x: 0px;
            --center-icons-shift-y: 0px;
            --icon-center-dot-width: 12px;
            --icon-center-dot-height: 12px;
            --icon-center-dot-scale: 1.1;
            --icon-center-dot-shift-x: 82px;
            --icon-center-dot-shift-y: 95px;
            --icon-right-kg-width: 44px;
            --icon-right-kg-height: 56px;
            --icon-right-kg-scale: 0.9;
            --icon-right-kg-shift-x: 0px;
            --icon-right-kg-shift-y: -15px;
            --icon-right-archive-width: 44px;
            --icon-right-archive-height: 56px;
            --icon-right-archive-scale: 0.8;
            --icon-right-archive-shift-x: 1px;
            --icon-right-archive-shift-y: -10px;
            --icon-right-ble-width: 44px;
            --icon-right-ble-height: 56px;
            --icon-right-ble-scale: 0.8;
            --icon-right-ble-shift-x: 0px;
            --icon-right-ble-shift-y: -5px;
            --icon-right-lb-width: 44px;
            --icon-right-lb-height: 56px;
            --icon-right-lb-scale: 0.8;
            --icon-right-lb-shift-x: 0px;
            --icon-right-lb-shift-y: -10px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .app-container {
            background-color: #2c2c2c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 800px;
            max-width: 95vw;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 顯示器區塊 */
        .display-board {
            background-color: var(--bg-color);
            padding: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border: 2px solid #000;
            position: relative;
            overflow: hidden;
        }
        .display-board.anchor-right {
            justify-content: center;
            padding-right: 40px;
        }
        .display-board.anchor-left {
            justify-content: flex-start;
            padding-left: var(--digits-edge-offset);
        }
        .display-board::before {
            content: "";
            position: absolute;
            opacity: 0;
            width: var(--panel-bg-width);
            aspect-ratio: 229.61 / 113.39;
            top: 50%;
            left: 50%;
            transform: translate(calc(-50% - 8px), -50%); /* 往右 8px */
            background: url("./full_display.svg") center center / 100% 100% no-repeat;
            pointer-events: none;
            z-index: 0;
        }
        .preview-mode::before { display: none; }
        .display-board > * {
            position: relative;
            z-index: 1;
        }
        .digit {
            position: relative;
            width: 90px;
            height: 205px;
        }
        .display-line {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .digits-row {
            display: flex;
            gap: var(--digits-gap);
            transform: translate(var(--digits-shift-x), var(--digits-shift-y));
        }
        .digits-row .digit + .digit {
            margin-left: var(--digits-overlap);
        }
        .segment {
            fill: var(--led-off);
            fill-rule: evenodd;
            transition: fill 0.1s;
            cursor: pointer;
        }
        .segment:hover { opacity: 0.8; }
        .segment.on { fill: var(--led-on); }
        .preview-mode .segment {
            fill: var(--bg-color);
            cursor: default;
        }
        .preview-mode .segment.on { fill: var(--led-on); }
        .display-icon {
            flex: 0 0 auto;
            cursor: pointer;
            transform-origin: left top;
        }
        .icons-left {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--left-icons-inner-gap);
            margin-right: var(--left-icons-gap);
            transform: translate(var(--left-icon-shift-x), var(--left-icon-shift-y)) scale(var(--left-icon-scale));
            transform-origin: right center;
        }
        .icons-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--icons-inner-gap);
            margin-left: var(--icons-gap);
            transform: translate(var(--icon-shift-x), var(--icon-shift-y)) scale(var(--icon-scale));
            transform-origin: left top;
        }
        .center-icons-layer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translate(var(--center-icons-shift-x), var(--center-icons-shift-y));
            pointer-events: none;
            z-index: 2;
        }
        .center-icons-layer .display-icon {
            pointer-events: auto;
        }
        .display-icon:hover { opacity: 0.85; }
        .icon-shape {
            fill: var(--led-off);
            transition: fill 0.1s;
        }
        .icon-shape.on { fill: var(--led-on); }
        .preview-mode .display-icon { cursor: default; }
        .preview-mode .display-icon:hover { opacity: 1; }
        .preview-mode .icon-shape { fill: var(--bg-color); }
        .preview-mode .icon-shape.on { fill: var(--led-on); }
        .icon-left-loading .loading-body { fill: var(--loading-body-off); }
        .icon-left-loading .loading-dot { fill: var(--loading-dot-off); }
        .icon-left-loading .loading-body.on { fill: var(--loading-body-on); }
        .icon-left-loading .loading-dot.on { fill: var(--loading-dot-on); }
        .icon-left-loading:hover .loading-body,
        .icon-left-loading:hover .loading-dot {
            filter: brightness(0.7);
        }
        .icon-left-accucheck .accucheck-body { fill: var(--accucheck-body-off); }
        .icon-left-accucheck .accucheck-mark { fill: var(--accucheck-mark-off); }
        .icon-left-accucheck .accucheck-body.on { fill: var(--accucheck-body-on); }
        .icon-left-accucheck .accucheck-mark.on { fill: var(--accucheck-mark-on); }
        .icon-left-accucheck:hover .accucheck-body,
        .icon-left-accucheck:hover .accucheck-mark {
            filter: brightness(0.7);
        }
        .preview-mode .icon-left-loading .loading-body:not(.on),
        .preview-mode .icon-left-loading .loading-dot:not(.on),
        .preview-mode .icon-left-accucheck .accucheck-body:not(.on),
        .preview-mode .icon-left-accucheck .accucheck-mark:not(.on) {
            fill: var(--bg-color);
            filter: none;
        }

        /* 編輯控制列 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #3a3a3a;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .beeper-switch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .beeper-switch input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--secondary);
            cursor: pointer;
        }
        input[type="number"] {
            width: 70px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: white;
            font-size: 16px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-add { background-color: var(--secondary); color: #000; }
        .btn-add:hover { background-color: #ffca28; }
        .btn-save { background-color: var(--primary); color: white; }
        .btn-save:hover { background-color: var(--primary-hover); }
        .btn-new { background-color: #2f7de1; color: white; }
        .btn-new:hover { background-color: #2768bd; }
        .btn-compact {
            padding: 0 14px;
            font-size: 14px;
            border-radius: 5px;
            width: 86px;
            height: 44px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-play { background-color: var(--primary); color: white; width: 100px; }
        .btn-edit { background-color: #555; color: white; }
        .preview-controls {
            position: relative;
            justify-content: center;
            gap: 0;
            min-height: 62px;
        }
        .preview-center-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .btn-download {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            min-width: 120px;
        }
        .btn-download:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* 時間軸區塊 */
        .timeline-container {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }
        .frame-thumb {
            background: var(--bg-color);
            border: 2px solid #444;
            border-radius: 4px;
            padding: 10px;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: grab;
            user-select: none;
            transition: border-color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
        }
        .frame-thumb.dragging {
            opacity: 0.45;
            transform: scale(0.98);
            cursor: grabbing;
        }
        .frame-thumb.drag-over {
            border-color: var(--secondary);
        }
        .frame-thumb.selected {
            border-color: var(--secondary);
        }
        .frame-thumb .display-mini {
            width: 150px;
            height: 84px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            pointer-events: none;
            overflow: hidden;
        }
        .frame-thumb .display-mini .display-line {
            transform: scale(0.2);
            transform-origin: center center;
        }
        .frame-thumb .duration-badge {
            background: #444; font-size: 12px; padding: 2px 6px; border-radius: 4px;
        }
        .frame-thumb .beeper-badge {
            margin-top: 6px;
            background: #2f2f2f;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            color: #cfcfcf;
        }
        .frame-thumb .icons-badge {
            margin-top: 4px;
            background: #2b2b2b;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            color: #bdbdbd;
        }
        .frame-thumb .delete-btn {
            position: absolute; top: -8px; right: -8px; background: red; color: white;
            border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .empty-timeline { color: #777; width: 100%; text-align: center; margin-top: 30px; }
        .animation-card {
            background: var(--bg-color);
            border: 2px solid #444;
            border-radius: 4px;
            padding: 10px;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        .animation-card.active {
            border-color: var(--secondary);
        }
        .animation-card.dragging {
            opacity: 0.45;
            transform: scale(0.98);
        }
        .animation-card.drag-over {
            border-color: var(--secondary);
        }
        .animation-card .display-mini {
            width: 150px;
            height: 84px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            pointer-events: none;
            overflow: hidden;
        }
        .animation-card .display-mini .display-line {
            transform: scale(0.2);
            transform-origin: center center;
        }
        .animation-card .duration-badge {
            background: #444;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .animation-card .delete-btn {
            position: absolute;
            top: -9px;
            right: -9px;
            background: red;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1;
        }
        .animation-card .duplicate-btn {
            position: absolute;
            top: 50px;
            right: -9px;
            transform: none;
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #fff;
            color: #111;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .animation-card .duplicate-btn:hover {
            background: #f1f1f1;
        }

        /* 隱藏區塊用 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1 id="view-title">Edit Mode</h1>
        <div class="header-actions">
            <button id="btn-new-animation" class="btn-new btn-compact hidden">＋New</button>
            <button id="btn-toggle-view" class="btn-save">Switch to Preview (Save & Preview)</button>
        </div>
    </div>

    <div id="main-display" class="display-board anchor-right"></div>

    <div id="editor-controls" class="controls">
        <div class="control-group">
            <button id="btn-clear" style="background:#555; color:white;">Clear Canvas</button>
            <label class="beeper-switch" for="input-beeper">
                <input type="checkbox" id="input-beeper">
                <span>Beeper</span>
            </label>
        </div>
        <div class="control-group">
            <label>Duration:</label>
            <input type="number" id="input-duration" value="0.5" step="0.1" min="0.1">
            <span>s</span>
            <button id="btn-add-frame" class="btn-add">➕ Save as Frame</button>
        </div>
    </div>

    <div id="preview-controls" class="controls preview-controls hidden">
        <div class="preview-center-controls">
            <button id="btn-play-pause" class="btn-play">▶</button>
            <button id="btn-stop" class="btn-edit">⏹</button>
        </div>
        <button id="btn-download" class="btn-edit btn-download">Download</button>
    </div>

    <div id="preview-animations-section" class="hidden">
        <h3 style="margin-top: 0; font-size: 16px; color: #aaa;">Animations</h3>
        <div id="preview-animations" class="timeline-container">
            <div class="empty-timeline">No saved animations yet.</div>
        </div>
    </div>

    <div id="timeline-section">
        <h3 style="margin-top: 0; font-size: 16px; color: #aaa;">Timeline</h3>
        <div id="timeline" class="timeline-container">
            <div class="empty-timeline">No frames yet. Edit above and click "Save as Frame".</div>
        </div>
    </div>
</div>

<script>
    // 定義 7 段顯示器的 SVG 路徑 (以 A-G 順序排列)
    // A:上, B:右上, C:右下, D:下, E:左下, F:左上, G:中

        "M29.01,45.94l-3.39-3.83.89-33.62,5.66-5.98c.97,1.29,1.48,2.93,1.43,4.6l-.93,34.97-3.66,3.86Z", // B

        "M4.59,47.49l-3.66,3.86L0,86.32c-.05,1.67.45,3.31,1.43,4.6l5.66-5.98.89-33.62-3.39-3.83Z", // E
        "M4.62,45.94l-3.39-3.83L2.17,6.63c.05-1.59.6-3.11,1.57-4.3l5.42,6.13-.89,33.62-3.66,3.86Z", // F
        "M24.62,50.56L28.28,46.7l-3.38-3.83H8.97l-3.65,3.86,3.38,3.83h15.92Z"  // G
    ];
    const iconDefinitions = {

                body: "M12.75,0C5.71,0,0,5.71,0,12.75s5.71,12.75,12.75,12.75,12.75-5.71,12.75-12.75S19.8,0,12.75,0",

                    "M19.19,15.41c-1.47,0-2.66-1.19-2.66-2.66s1.19-2.66,2.66-2.66,2.66,1.19,2.66,2.66-1.19,2.66-2.66,2.66"
                ]
            }
        },
        leftAccucheck: {
            label: "ACCUCHECK",
            viewBox: "0 0 25.5 25.5",
            accucheckPaths: {
                body: "M12.75,0h0C5.71,0,0,5.71,0,12.75s5.71,12.75,12.75,12.75,12.75-5.71,12.75-12.75S19.8,0,12.75,0",
                mark: "M20.24,9.32l-7.96,9.01c-.62.7-1.7.73-2.36.07l-4.58-4.59c-.64-.64-.64-1.67,0-2.3.64-.64,1.67-.64,2.3,0l3.35,3.36,6.81-7.71c.6-.67,1.63-.74,2.3-.14.67.6.74,1.62.14,2.3"
            }
        },
        leftLowbattery: {
            label: "LOWBATTERY",
            viewBox: "0 0 20.25 9.74",
            path: "M19.58,3.06h-.86v-1.52c0-.85-.69-1.54-1.54-1.54H1.54C.69,0,0,.69,0,1.54v6.65c0,.85.69,1.54,1.54,1.54h15.63c.85,0,1.54-.69,1.54-1.54v-1.52h.86c.37,0,.67-.3.67-.67v-2.27c0-.37-.3-.67-.67-.67M17.31,8.19c0,.07-.06.13-.13.13H3.77l1.27-6.91h12.13c.07,0,.13.06.13.13v6.65Z"

        centerDot: {

            path: "M5.58,2.79c0-1.54-1.25-2.79-2.79-2.79S0,1.25,0,2.79s1.25,2.79,2.79,2.79,2.79-1.25,2.79-2.79"
        },
        rightBle: {

    function createEmptySegments() {
        return Array(4).fill(null).map(() => Array(7).fill(false));
    }

    function createDefaultIcons() {
        return {
            leftLoading: false,
            leftAccucheck: false,
            leftLowbattery: false,
            centerDot: false,
            rightBle: false,
            rightArchive: false,
            rightKg: false,
            rightLb: false
        };
    }

    // 系統狀態
    let currentSegments = createEmptySegments(); // 當前畫板狀態 4個數字 x 7個段碼
    let frames = []; // 目前編輯中的影格
    let animations = []; // 儲存的動畫列表
    let activeAnimationIndex = null; // Preview 目前選中的動畫
    let editingAnimationIndex = null; // Edit 目前編輯的動畫
    let isPreviewMode = false;
    let isPlaying = false;
    let playTimeout = null;
    let currentFrameIndex = 0;
    let currentBeeperOn = false;
    let currentIcons = createDefaultIcons();
    let audioContext = null;
    let beeperOscillator = null;
    let beeperGainNode = null;
    let beeperStopTimeout = null;
    let dragFromIndex = null;
    let animationDragFromIndex = null;
    let selectedFrameIndex = null; // Edit mode timeline currently selected frame
    let isExportingVideo = false;
    const EXPORT_FRAME_RATE = 30;
    const EXPORT_MIME_TYPES = [
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
    ];

    // DOM 元素
    const mainDisplay = document.getElementById('main-display');
    const timeline = document.getElementById('timeline');
    const viewTitle = document.getElementById('view-title');
    const btnToggleView = document.getElementById('btn-toggle-view');
    const btnNewAnimation = document.getElementById('btn-new-animation');
    const editorControls = document.getElementById('editor-controls');
    const previewControls = document.getElementById('preview-controls');
    const timelineSection = document.getElementById('timeline-section');
    const previewAnimationsSection = document.getElementById('preview-animations-section');
    const previewAnimations = document.getElementById('preview-animations');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnStop = document.getElementById('btn-stop');
    const btnDownload = document.getElementById('btn-download');
    const inputBeeper = document.getElementById('input-beeper');
    const inputDuration = document.getElementById('input-duration');

    // 生成單個數字的 SVG HTML
    function createDigitHTML(digitIndex, segmentsState, isMini = false) {
        let svgContent = '';
        segmentPaths.forEach((path, segIndex) => {
            const isOn = segmentsState[segIndex] ? 'on' : '';
            const onClickHandler = isMini ? '' : `onclick="toggleSegment(${digitIndex}, ${segIndex})"`;
            svgContent += `<path d="${path}" class="segment ${isOn}" data-digit="${digitIndex}" data-seg="${segIndex}" ${onClickHandler}></path>`;
        });
        // 修正 viewBox 使縮放比例一致
        return `<svg class="digit" viewBox="0 0 33.6 93.43" preserveAspectRatio="xMidYMid meet">${svgContent}</svg>`;
    }

    function iconKeyToCssToken(iconKey) {
        return iconKey.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
    }

    function createIconHTML(iconKey, isOn, isMini = false) {
        const icon = iconDefinitions[iconKey];
        if (!icon) return '';
        const onClass = isOn ? 'on' : '';
        const onClickHandler = isMini ? '' : `onclick="toggleIcon('${iconKey}')"`;
        const cssToken = iconKeyToCssToken(iconKey);
        const iconClass = `icon-${cssToken}`;
        const inlineStyle = [
            `width: var(--icon-${cssToken}-width, 44px)`,
            `height: var(--icon-${cssToken}-height, 56px)`,
            `transform: translate(var(--icon-${cssToken}-shift-x, 0px), var(--icon-${cssToken}-shift-y, 0px)) scale(var(--icon-${cssToken}-scale, 1))`
        ].join('; ');
        if (icon.loadingPaths) {
            const dotsHtml = icon.loadingPaths.dots
                .map(pathD => `<path class="loading-dot ${onClass}" d="${pathD}"></path>`)
                .join('');
            return `
                <svg class="display-icon ${iconClass}" style="${inlineStyle}" viewBox="${icon.viewBox}" preserveAspectRatio="xMidYMid meet" ${onClickHandler}>
                    <path class="loading-body ${onClass}" d="${icon.loadingPaths.body}"></path>
                    ${dotsHtml}
                </svg>
            `;
        }
        if (icon.accucheckPaths) {
            return `
                <svg class="display-icon ${iconClass}" style="${inlineStyle}" viewBox="${icon.viewBox}" preserveAspectRatio="xMidYMid meet" ${onClickHandler}>
                    <path class="accucheck-body ${onClass}" d="${icon.accucheckPaths.body}"></path>
                    <path class="accucheck-mark ${onClass}" d="${icon.accucheckPaths.mark}"></path>
                </svg>
            `;
        }
        const rectHtml = icon.rect ? `<rect class="icon-shape ${onClass}" width="${icon.rect.width}" height="${icon.rect.height}"></rect>` : '';
        const polygonHtml = icon.polygon ? `<polygon class="icon-shape ${onClass}" points="${icon.polygon}"></polygon>` : '';
        const pathsHtml = icon.paths
            ? icon.paths.map(pathD => `<path class="icon-shape ${onClass}" d="${pathD}"></path>`).join('')
            : `<path class="icon-shape ${onClass}" d="${icon.path}"></path>`;
        return `
            <svg class="display-icon ${iconClass}" style="${inlineStyle}" viewBox="${icon.viewBox}" preserveAspectRatio="xMidYMid meet" ${onClickHandler}>
                ${rectHtml}
                ${polygonHtml}
                ${pathsHtml}
            </svg>
        `;
    }

    function createLeftIconsHTML(iconsState, isMini = false) {
        return `
            <div class="icons-left">
                ${createIconHTML('leftLoading', !!iconsState.leftLoading, isMini)}
                ${createIconHTML('leftAccucheck', !!iconsState.leftAccucheck, isMini)}
                ${createIconHTML('leftLowbattery', !!iconsState.leftLowbattery, isMini)}
            </div>
        `;
    }

    function createRightIconsHTML(iconsState, isMini = false) {
        return `
            <div class="icons-right">
                ${createIconHTML('rightBle', !!iconsState.rightBle, isMini)}
                ${createIconHTML('rightArchive', !!iconsState.rightArchive, isMini)}
                ${createIconHTML('rightKg', !!iconsState.rightKg, isMini)}
                ${createIconHTML('rightLb', !!iconsState.rightLb, isMini)}
            </div>
        `;
    }

    function createCenterIconsHTML(iconsState, isMini = false) {
        return `
            <div class="center-icons-layer">
                ${createIconHTML('centerDot', !!iconsState.centerDot, isMini)}
            </div>
        `;
    }

    function getFrameIcons(frame) {
        return {
            leftLoading: !!(frame.icons && frame.icons.leftLoading),
            leftAccucheck: !!(frame.icons && frame.icons.leftAccucheck),
            leftLowbattery: !!(frame.icons && frame.icons.leftLowbattery),
            centerDot: !!(frame.icons && frame.icons.centerDot),
            rightBle: !!(frame.icons && frame.icons.rightBle),
            rightArchive: !!(frame.icons && frame.icons.rightArchive),
            rightKg: !!(frame.icons && frame.icons.rightKg),
            rightLb: !!(frame.icons && frame.icons.rightLb)
        };
    }

    function cloneFrames(sourceFrames) {
        return JSON.parse(JSON.stringify(sourceFrames || []));
    }

    function buildMiniDisplayHtml(frame) {
        const frameIcons = getFrameIcons(frame);
        let miniDigits = '<div class="digits-row">';
        frame.segments.forEach((digitState) => {
            miniDigits += createDigitHTML(0, digitState, true);
        });
        miniDigits += '</div>';
        return `
            <div class="display-mini">
                <div class="display-line">
                    ${createLeftIconsHTML(frameIcons, true)}
                    ${miniDigits}
                    ${createCenterIconsHTML(frameIcons, true)}
                    ${createRightIconsHTML(frameIcons, true)}
                </div>
            </div>
        `;
    }

    function getAnimationDuration(animation) {
        if (!animation || !Array.isArray(animation.frames)) return 0;
        return animation.frames.reduce((sum, frame) => sum + (Number(frame.duration) || 0), 0);
    }

    function getActiveAnimation() {
        if (activeAnimationIndex === null) return null;
        return animations[activeAnimationIndex] || null;
    }

    function clearEditorCanvasOnly() {
        currentSegments = createEmptySegments();
        currentIcons = createDefaultIcons();
        currentBeeperOn = false;
        inputBeeper.checked = false;
        renderMainDisplay();
    }

    function loadEditorStateFromFrame(frame) {
        if (!frame) {
            clearEditorCanvasOnly();
            return;
        }
        currentSegments = JSON.parse(JSON.stringify(frame.segments));
        currentIcons = getFrameIcons(frame);
        currentBeeperOn = !!frame.beeper;
        inputBeeper.checked = currentBeeperOn;
        inputDuration.value = Number(frame.duration) || 0.5;
        renderMainDisplay();
    }

    function toggleTimelineSelection(index) {
        if (selectedFrameIndex === index) {
            selectedFrameIndex = null;
            renderTimeline();
            return;
        }
        selectedFrameIndex = index;
        loadEditorStateFromFrame(frames[index]);
        renderTimeline();
    }

    // 渲染主顯示器
    function renderMainDisplay() {
        mainDisplay.innerHTML = '';
        const line = document.createElement('div');
        line.className = 'display-line';
        const row = document.createElement('div');
        row.className = 'digits-row';
        currentSegments.forEach((digitState, index) => {
            row.innerHTML += createDigitHTML(index, digitState);
        });
        line.insertAdjacentHTML('beforeend', createLeftIconsHTML(currentIcons));
        line.appendChild(row);
        line.insertAdjacentHTML('beforeend', createCenterIconsHTML(currentIcons));
        line.insertAdjacentHTML('beforeend', createRightIconsHTML(currentIcons));
        mainDisplay.appendChild(line);
    }

    // 切換段碼亮滅 (由 SVG Path 的 onclick 觸發)
    window.toggleSegment = function(digitIndex, segIndex) {
        if (isPreviewMode) return;
        currentSegments[digitIndex][segIndex] = !currentSegments[digitIndex][segIndex];
        
        // 僅更新被點擊的那個 path 的 class，提升效能
        const pathElements = mainDisplay.querySelectorAll(`path[data-digit="${digitIndex}"]`);
        if(currentSegments[digitIndex][segIndex]) {
            pathElements[segIndex].classList.add('on');
        } else {
            pathElements[segIndex].classList.remove('on');
        }
    };

    window.toggleIcon = function(iconKey) {
        if (isPreviewMode) return;
        if (!(iconKey in currentIcons)) return;
        currentIcons[iconKey] = !currentIcons[iconKey];
        renderMainDisplay();
    };

    // 儲存為影格
    document.getElementById('btn-add-frame').addEventListener('click', () => {
        const duration = parseFloat(inputDuration.value) || 0.5;
        const frameData = JSON.parse(JSON.stringify(currentSegments));
        const newFrame = {
            segments: frameData,
            duration,
            beeper: currentBeeperOn,
            icons: { ...currentIcons }
        };
        if (selectedFrameIndex !== null && frames[selectedFrameIndex]) {
            const insertIndex = selectedFrameIndex + 1;
            frames.splice(insertIndex, 0, newFrame);
            selectedFrameIndex = insertIndex;
        } else {
            frames.push(newFrame);
            selectedFrameIndex = null;
        }
        renderTimeline();
    });

    // 渲染下方時間軸
    function renderTimeline() {
        if (selectedFrameIndex !== null && !frames[selectedFrameIndex]) {
            selectedFrameIndex = null;
        }
        if (frames.length === 0) {
            selectedFrameIndex = null;
            timeline.innerHTML = '<div class="empty-timeline">No frames yet. Edit above and click "Save as Frame".</div>';
            return;
        }
        timeline.innerHTML = '';
        frames.forEach((frame, index) => {
            const frameHtml = `
                <div class="frame-thumb ${index === selectedFrameIndex ? 'selected' : ''}" draggable="true" data-index="${index}">
                    <div class="delete-btn" onclick="deleteFrame(${index})">✕</div>
                    ${buildMiniDisplayHtml(frame)}
                    <div class="duration-badge">${frame.duration}s</div>
                    <div class="beeper-badge">🔔 ${frame.beeper ? 'ON' : 'OFF'}</div>
                </div>
            `;
            timeline.innerHTML += frameHtml;
        });

        const thumbs = timeline.querySelectorAll('.frame-thumb');
        thumbs.forEach((thumb) => {
            thumb.addEventListener('dragstart', onFrameDragStart);
            thumb.addEventListener('dragover', onFrameDragOver);
            thumb.addEventListener('drop', onFrameDrop);
            thumb.addEventListener('dragleave', onFrameDragLeave);
            thumb.addEventListener('dragend', onFrameDragEnd);
            thumb.addEventListener('click', (event) => {
                if (event.target.closest('.delete-btn')) return;
                const index = Number(thumb.dataset.index);
                if (!Number.isNaN(index)) toggleTimelineSelection(index);
            });
        });
    }

    function updatePreviewControlState() {
        const hasActiveFrames = Array.isArray(frames) && frames.length > 0;
        btnPlayPause.disabled = !hasActiveFrames;
        btnStop.disabled = !hasActiveFrames;
        btnDownload.disabled = !hasActiveFrames || isExportingVideo;
    }

    function renderPreviewAnimations() {
        if (animations.length === 0) {
            previewAnimations.innerHTML = '<div class="empty-timeline">No saved animations yet.</div>';
            updatePreviewControlState();
            return;
        }

        previewAnimations.innerHTML = '';
        animations.forEach((animation, index) => {
            const firstFrame = animation.frames[0];
            const totalDuration = getAnimationDuration(animation).toFixed(1);
            const duplicateBtnHtml = index === activeAnimationIndex
                ? `<button class="duplicate-btn" data-animation-duplicate="${index}" title="Duplicate animation">+</button>`
                : '';
            const cardHtml = `
                <div class="animation-card ${index === activeAnimationIndex ? 'active' : ''}" draggable="true" data-animation-index="${index}">
                    <div class="delete-btn" data-animation-delete="${index}">✕</div>
                    ${duplicateBtnHtml}
                    ${firstFrame ? buildMiniDisplayHtml(firstFrame) : '<div class="empty-timeline" style="margin-top: 10px;">Empty</div>'}
                    <div class="duration-badge">${totalDuration}s</div>
                </div>
            `;
            previewAnimations.insertAdjacentHTML('beforeend', cardHtml);
        });

        previewAnimations.querySelectorAll('.animation-card').forEach((card) => {
            card.addEventListener('dragstart', onAnimationDragStart);
            card.addEventListener('dragover', onAnimationDragOver);
            card.addEventListener('drop', onAnimationDrop);
            card.addEventListener('dragleave', onAnimationDragLeave);
            card.addEventListener('dragend', onAnimationDragEnd);
            card.addEventListener('click', (event) => {
                const deleteBtn = event.target.closest('[data-animation-delete]');
                if (deleteBtn) {
                    const index = Number(deleteBtn.dataset.animationDelete);
                    if (!Number.isNaN(index)) deleteAnimation(index);
                    event.stopPropagation();
                    return;
                }
                const duplicateBtn = event.target.closest('[data-animation-duplicate]');
                if (duplicateBtn) {
                    const index = Number(duplicateBtn.dataset.animationDuplicate);
                    if (!Number.isNaN(index)) duplicateAnimation(index);
                    event.stopPropagation();
                    return;
                }
                const index = Number(card.dataset.animationIndex);
                if (!Number.isNaN(index)) selectAnimation(index);
            });
        });
        updatePreviewControlState();
    }

    function remapMovedIndex(index, fromIndex, toIndex) {
        if (index === null) return null;
        if (index === fromIndex) return toIndex;
        if (fromIndex < index && toIndex >= index) return index - 1;
        if (fromIndex > index && toIndex <= index) return index + 1;
        return index;
    }

    function onAnimationDragStart(event) {
        if (event.target.closest('[data-animation-delete]') || event.target.closest('[data-animation-duplicate]')) {
            event.preventDefault();
            return;
        }
        const card = event.currentTarget;
        animationDragFromIndex = Number(card.dataset.animationIndex);
        card.classList.add('dragging');
        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', String(animationDragFromIndex));
        }
    }

    function onAnimationDragOver(event) {
        event.preventDefault();
        const hoverIndex = Number(event.currentTarget.dataset.animationIndex);
        if (hoverIndex === animationDragFromIndex) return;
        event.currentTarget.classList.add('drag-over');
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    }

    function onAnimationDragLeave(event) {
        event.currentTarget.classList.remove('drag-over');
    }

    function onAnimationDrop(event) {
        event.preventDefault();
        const toIndex = Number(event.currentTarget.dataset.animationIndex);
        event.currentTarget.classList.remove('drag-over');
        if (animationDragFromIndex === null || Number.isNaN(toIndex) || animationDragFromIndex === toIndex) return;

        stopPlayback();
        const [movedAnimation] = animations.splice(animationDragFromIndex, 1);
        animations.splice(toIndex, 0, movedAnimation);
        activeAnimationIndex = remapMovedIndex(activeAnimationIndex, animationDragFromIndex, toIndex);
        editingAnimationIndex = remapMovedIndex(editingAnimationIndex, animationDragFromIndex, toIndex);

        if (activeAnimationIndex !== null && animations[activeAnimationIndex]) {
            frames = cloneFrames(animations[activeAnimationIndex].frames);
            currentFrameIndex = 0;
            if (frames.length > 0) loadFrameToDisplay(0);
        } else {
            frames = [];
            mainDisplay.innerHTML = '';
        }

        animationDragFromIndex = null;
        renderPreviewAnimations();
    }

    function onAnimationDragEnd() {
        previewAnimations.querySelectorAll('.animation-card').forEach((card) => {
            card.classList.remove('dragging', 'drag-over');
        });
        animationDragFromIndex = null;
    }

    function onFrameDragStart(event) {
        if (event.target.closest('.delete-btn')) {
            event.preventDefault();
            return;
        }
        const thumb = event.currentTarget;
        dragFromIndex = Number(thumb.dataset.index);
        thumb.classList.add('dragging');
        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', String(dragFromIndex));
        }
    }

    function onFrameDragOver(event) {
        event.preventDefault();
        const hoverIndex = Number(event.currentTarget.dataset.index);
        if (hoverIndex === dragFromIndex) return;
        event.currentTarget.classList.add('drag-over');
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    }

    function onFrameDragLeave(event) {
        event.currentTarget.classList.remove('drag-over');
    }

    function onFrameDrop(event) {
        event.preventDefault();
        const toIndex = Number(event.currentTarget.dataset.index);
        event.currentTarget.classList.remove('drag-over');
        if (dragFromIndex === null || Number.isNaN(toIndex) || dragFromIndex === toIndex) return;
        const [movedFrame] = frames.splice(dragFromIndex, 1);
        frames.splice(toIndex, 0, movedFrame);

        if (selectedFrameIndex === dragFromIndex) {
            selectedFrameIndex = toIndex;
        } else if (selectedFrameIndex !== null) {
            if (dragFromIndex < selectedFrameIndex && toIndex >= selectedFrameIndex) {
                selectedFrameIndex -= 1;
            } else if (dragFromIndex > selectedFrameIndex && toIndex <= selectedFrameIndex) {
                selectedFrameIndex += 1;
            }
        }

        dragFromIndex = null;
        renderTimeline();
    }

    function onFrameDragEnd() {
        timeline.querySelectorAll('.frame-thumb').forEach((thumb) => {
            thumb.classList.remove('dragging', 'drag-over');
        });
        dragFromIndex = null;
    }

    // 刪除影格
    window.deleteFrame = function(index) {
        frames.splice(index, 1);
        if (selectedFrameIndex === index) {
            selectedFrameIndex = null;
        } else if (selectedFrameIndex !== null && index < selectedFrameIndex) {
            selectedFrameIndex -= 1;
        }
        renderTimeline();
    };

    function selectAnimation(index) {
        if (!animations[index]) return;
        stopPlayback();
        activeAnimationIndex = index;
        editingAnimationIndex = index;
        frames = cloneFrames(animations[index].frames);
        selectedFrameIndex = null;
        currentFrameIndex = 0;
        if (frames.length > 0) {
            loadFrameToDisplay(0);
        } else {
            mainDisplay.innerHTML = '';
        }
        renderPreviewAnimations();
    }

    function deleteAnimation(index) {
        if (!animations[index]) return;
        stopPlayback();
        const wasActive = index === activeAnimationIndex;
        const wasEditing = index === editingAnimationIndex;
        animations.splice(index, 1);

        if (wasEditing) editingAnimationIndex = null;
        if (editingAnimationIndex !== null && editingAnimationIndex > index) {
            editingAnimationIndex -= 1;
        }
        if (activeAnimationIndex !== null && activeAnimationIndex > index) {
            activeAnimationIndex -= 1;
        }

        if (wasActive) {
            if (animations.length === 0) {
                activeAnimationIndex = null;
                frames = [];
                selectedFrameIndex = null;
                mainDisplay.innerHTML = '';
            } else {
                const nextIndex = Math.min(index, animations.length - 1);
                activeAnimationIndex = nextIndex;
                frames = cloneFrames(animations[nextIndex].frames);
                selectedFrameIndex = null;
                if (frames.length > 0) loadFrameToDisplay(0);
            }
        }
        renderPreviewAnimations();
    }

    function duplicateAnimation(index) {
        if (!animations[index]) return;
        stopPlayback();
        const duplicated = { frames: cloneFrames(animations[index].frames) };
        animations.splice(index + 1, 0, duplicated);
        activeAnimationIndex = index + 1;
        editingAnimationIndex = activeAnimationIndex;
        frames = cloneFrames(duplicated.frames);
        selectedFrameIndex = null;
        currentFrameIndex = 0;
        if (frames.length > 0) {
            loadFrameToDisplay(0);
        } else {
            mainDisplay.innerHTML = '';
        }
        renderPreviewAnimations();
    }

    function persistEditingAnimation() {
        const storedFrames = cloneFrames(frames);
        if (editingAnimationIndex === null) {
            animations.push({ frames: storedFrames });
            editingAnimationIndex = animations.length - 1;
        } else if (animations[editingAnimationIndex]) {
            animations[editingAnimationIndex].frames = storedFrames;
        } else {
            animations.push({ frames: storedFrames });
            editingAnimationIndex = animations.length - 1;
        }
        activeAnimationIndex = editingAnimationIndex;
    }

    function enterPreviewMode() {
        const activeAnimation = getActiveAnimation();
        frames = cloneFrames(activeAnimation ? activeAnimation.frames : []);
        selectedFrameIndex = null;

        isPreviewMode = true;
        viewTitle.innerText = "Preview Mode";
        btnToggleView.innerText = "Edit";
        btnToggleView.classList.add('btn-edit', 'btn-compact');
        btnToggleView.classList.remove('btn-save');
        btnNewAnimation.classList.remove('hidden');
        mainDisplay.classList.add('preview-mode');
        editorControls.classList.add('hidden');
        timelineSection.classList.add('hidden');
        previewControls.classList.remove('hidden');
        previewAnimationsSection.classList.remove('hidden');

        stopPlayback();
        if (frames.length > 0) {
            loadFrameToDisplay(0);
        } else {
            mainDisplay.innerHTML = '';
        }
        renderPreviewAnimations();
    }

    function enterEditMode() {
        isPreviewMode = false;
        viewTitle.innerText = "Edit Mode";
        btnToggleView.innerText = "Switch to Preview (Save & Preview)";
        btnToggleView.classList.add('btn-save');
        btnToggleView.classList.remove('btn-edit', 'btn-compact');
        btnNewAnimation.classList.add('hidden');
        mainDisplay.classList.remove('preview-mode');
        editorControls.classList.remove('hidden');
        timelineSection.classList.remove('hidden');
        previewControls.classList.add('hidden');
        previewAnimationsSection.classList.add('hidden');

        stopPlayback();
        renderTimeline();
        selectedFrameIndex = null;
        if (frames.length > 0) {
            loadEditorStateFromFrame(frames[0]);
        } else {
            clearEditorCanvasOnly();
        }
    }

    function startNewAnimationFromPreview() {
        stopPlayback();
        editingAnimationIndex = null;
        frames = [];
        selectedFrameIndex = null;
        enterEditMode();
    }

    // 清除畫板
    document.getElementById('btn-clear').addEventListener('click', clearEditorCanvasOnly);

    inputBeeper.addEventListener('change', (event) => {
        currentBeeperOn = event.target.checked;
    });

    // 切換 編輯 / 預覽 模式
    btnToggleView.addEventListener('click', () => {
        if (!isPreviewMode) {
            if (frames.length === 0) {
                alert("Please save at least one frame before previewing.");
                return;
            }
            persistEditingAnimation();
            enterPreviewMode();
        } else {
            const activeAnimation = getActiveAnimation();
            if (activeAnimation) {
                editingAnimationIndex = activeAnimationIndex;
                frames = cloneFrames(activeAnimation.frames);
                selectedFrameIndex = null;
            } else {
                editingAnimationIndex = null;
                frames = [];
                selectedFrameIndex = null;
            }
            enterEditMode();
        }
    });

    btnNewAnimation.addEventListener('click', startNewAnimationFromPreview);

    // 預覽播放邏輯
    function loadFrameToDisplay(index) {
        if(!frames[index]) return;
        const frame = frames[index];
        const frameIcons = getFrameIcons(frame);
        mainDisplay.innerHTML = '';
        const line = document.createElement('div');
        line.className = 'display-line';
        const row = document.createElement('div');
        row.className = 'digits-row';
        frame.segments.forEach(digitState => {
            row.innerHTML += createDigitHTML(0, digitState, true);
        });
        line.insertAdjacentHTML('beforeend', createLeftIconsHTML(frameIcons, true));
        line.appendChild(row);
        line.insertAdjacentHTML('beforeend', createCenterIconsHTML(frameIcons, true));
        line.insertAdjacentHTML('beforeend', createRightIconsHTML(frameIcons, true));
        mainDisplay.appendChild(line);
    }

    function getSupportedExportMimeType() {
        if (typeof MediaRecorder === 'undefined') return null;
        for (const mimeType of EXPORT_MIME_TYPES) {
            if (MediaRecorder.isTypeSupported(mimeType)) return mimeType;
        }
        return null;
    }

    function getFileExtensionFromMimeType(mimeType) {
        if (!mimeType) return 'mp4';
        if (mimeType.includes('webm')) return 'webm';
        if (mimeType.includes('mp4')) return 'mp4';
        return 'mp4';
    }

    function drawSvgShapeToCanvas(ctx, shapeElement) {
        const tagName = shapeElement.tagName.toLowerCase();
        if (tagName === 'path') {
            const d = shapeElement.getAttribute('d');
            if (!d) return;
            const path = new Path2D(d);
            const style = getComputedStyle(shapeElement);
            const fillColor = style.fill;
            const strokeColor = style.stroke;
            const fillRule = style.fillRule === 'evenodd' ? 'evenodd' : 'nonzero';
            if (fillColor && fillColor !== 'none' && fillColor !== 'rgba(0, 0, 0, 0)') {
                ctx.fillStyle = fillColor;
                ctx.fill(path, fillRule);
            }
            if (strokeColor && strokeColor !== 'none' && strokeColor !== 'rgba(0, 0, 0, 0)') {
                ctx.strokeStyle = strokeColor;
                const strokeWidth = Number.parseFloat(style.strokeWidth || '0');
                if (strokeWidth > 0) ctx.lineWidth = strokeWidth;
                ctx.stroke(path);
            }
            return;
        }

        if (tagName === 'rect') {
            const style = getComputedStyle(shapeElement);
            const x = Number.parseFloat(shapeElement.getAttribute('x') || '0');
            const y = Number.parseFloat(shapeElement.getAttribute('y') || '0');
            const w = Number.parseFloat(shapeElement.getAttribute('width') || '0');
            const h = Number.parseFloat(shapeElement.getAttribute('height') || '0');
            if (w <= 0 || h <= 0) return;
            if (style.fill && style.fill !== 'none' && style.fill !== 'rgba(0, 0, 0, 0)') {
                ctx.fillStyle = style.fill;
                ctx.fillRect(x, y, w, h);
            }
            return;
        }

        if (tagName === 'polygon' || tagName === 'polyline') {
            const pointsRaw = shapeElement.getAttribute('points') || '';
            const coords = pointsRaw
                .trim()
                .split(/[\s,]+/)
                .map((value) => Number.parseFloat(value))
                .filter((value) => Number.isFinite(value));
            const points = [];
            for (let i = 0; i + 1 < coords.length; i += 2) {
                points.push([coords[i], coords[i + 1]]);
            }
            if (points.length < 2) return;
            const path = new Path2D();
            path.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) {
                path.lineTo(points[i][0], points[i][1]);
            }
            if (tagName === 'polygon') path.closePath();
            const style = getComputedStyle(shapeElement);
            if (style.fill && style.fill !== 'none' && style.fill !== 'rgba(0, 0, 0, 0)') {
                ctx.fillStyle = style.fill;
                ctx.fill(path);
            }
            if (style.stroke && style.stroke !== 'none' && style.stroke !== 'rgba(0, 0, 0, 0)') {
                ctx.strokeStyle = style.stroke;
                const strokeWidth = Number.parseFloat(style.strokeWidth || '0');
                if (strokeWidth > 0) ctx.lineWidth = strokeWidth;
                ctx.stroke(path);
            }
        }
    }

    async function drawMainDisplayToCanvas(ctx, width, height) {
        const boardRect = mainDisplay.getBoundingClientRect();
        const boardStyle = getComputedStyle(mainDisplay);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = boardStyle.backgroundColor || '#0b0b0b';
        ctx.fillRect(0, 0, width, height);

        const svgElements = Array.from(mainDisplay.querySelectorAll('svg'));
        for (const svgElement of svgElements) {
            const rect = svgElement.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) continue;
            const x = rect.left - boardRect.left;
            const y = rect.top - boardRect.top;
            const viewBoxAttr = svgElement.getAttribute('viewBox');
            if (!viewBoxAttr) continue;
            const vb = viewBoxAttr.trim().split(/\s+/).map(Number.parseFloat);
            if (vb.length !== 4 || vb.some((value) => !Number.isFinite(value))) continue;
            const vbX = vb[0];
            const vbY = vb[1];
            const vbWidth = vb[2];
            const vbHeight = vb[3];
            if (vbWidth <= 0 || vbHeight <= 0) continue;
            const viewportWidth = rect.width;
            const viewportHeight = rect.height;
            const preserveAspectRatio = (svgElement.getAttribute('preserveAspectRatio') || 'xMidYMid meet').trim();

            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.rect(0, 0, viewportWidth, viewportHeight);
            ctx.clip();

            if (preserveAspectRatio === 'none') {
                const scaleX = viewportWidth / vbWidth;
                const scaleY = viewportHeight / vbHeight;
                ctx.translate(-vbX * scaleX, -vbY * scaleY);
                ctx.scale(scaleX, scaleY);
            } else {
                const [alignToken = 'xMidYMid', meetOrSlice = 'meet'] = preserveAspectRatio.split(/\s+/);
                const uniformScale = meetOrSlice === 'slice'
                    ? Math.max(viewportWidth / vbWidth, viewportHeight / vbHeight)
                    : Math.min(viewportWidth / vbWidth, viewportHeight / vbHeight);

                const renderWidth = vbWidth * uniformScale;
                const renderHeight = vbHeight * uniformScale;
                const extraX = viewportWidth - renderWidth;
                const extraY = viewportHeight - renderHeight;

                let alignX = 0;
                let alignY = 0;
                if (alignToken.startsWith('xMid')) alignX = extraX / 2;
                else if (alignToken.startsWith('xMax')) alignX = extraX;
                if (alignToken.endsWith('YMid')) alignY = extraY / 2;
                else if (alignToken.endsWith('YMax')) alignY = extraY;

                ctx.translate(alignX - vbX * uniformScale, alignY - vbY * uniformScale);
                ctx.scale(uniformScale, uniformScale);
            }
            const shapeElements = svgElement.querySelectorAll('path, rect, polygon, polyline');
            shapeElements.forEach((shapeElement) => drawSvgShapeToCanvas(ctx, shapeElement));
            ctx.restore();
        }
    }

    function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function waitForNextPaint() {
        return new Promise((resolve) => requestAnimationFrame(() => resolve()));
    }

    function getFrameDurationMs(frame) {
        return Math.max(100, Math.round((frame.duration || 0.1) * 1000));
    }

    async function createExportAudioTrack(framesToExport) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;

        const exportAudioContext = new AudioCtx();
        const destination = exportAudioContext.createMediaStreamDestination();
        const masterGain = exportAudioContext.createGain();
        masterGain.gain.value = 0.08;
        masterGain.connect(destination);

        let offsetSec = 0;
        for (const frame of framesToExport) {
            const frameDurationSec = getFrameDurationMs(frame) / 1000;
            if (frame && frame.beeper) {
                const oscillator = exportAudioContext.createOscillator();
                const gainNode = exportAudioContext.createGain();
                oscillator.type = 'square';
                oscillator.frequency.value = 3000;
                gainNode.gain.value = 1;
                oscillator.connect(gainNode);
                gainNode.connect(masterGain);

                const startTime = exportAudioContext.currentTime + offsetSec;
                const endTime = startTime + frameDurationSec;
                oscillator.start(startTime);
                oscillator.stop(endTime);
            }
            offsetSec += frameDurationSec;
        }

        if (exportAudioContext.state === 'suspended') {
            await exportAudioContext.resume();
        }

        const audioTrack = destination.stream.getAudioTracks()[0] || null;
        return {
            track: audioTrack,
            cleanup: async () => {
                if (audioTrack) audioTrack.stop();
                masterGain.disconnect();
                destination.disconnect();
                await exportAudioContext.close();
            }
        };
    }

    async function exportAnimationVideo() {
        if (isExportingVideo) return;
        if (frames.length === 0) {
            alert('Please save at least one frame before downloading.');
            return;
        }

        const mimeType = getSupportedExportMimeType();
        if (!mimeType) {
            alert('This browser does not support MP4 export via MediaRecorder.');
            return;
        }

        stopPlayback();
        isExportingVideo = true;
        updatePreviewControlState();
        const originalButtonText = btnDownload.innerText;
        btnDownload.innerText = 'Exporting...';

        const rect = mainDisplay.getBoundingClientRect();
        const width = Math.max(1, Math.round(rect.width));
        const height = Math.max(1, Math.round(rect.height));
        const dpr = window.devicePixelRatio || 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));

        const ctx = canvas.getContext('2d');
        if (!ctx) {
            isExportingVideo = false;
            btnDownload.innerText = originalButtonText;
            updatePreviewControlState();
            alert('Unable to initialize video export canvas.');
            return;
        }
        ctx.scale(dpr, dpr);

        const videoStream = canvas.captureStream(EXPORT_FRAME_RATE);
        let exportAudio = null;
        try {
            exportAudio = await createExportAudioTrack(frames);
        } catch (error) {
            console.warn('Failed to create export audio track.', error);
        }
        const streamTracks = [...videoStream.getVideoTracks()];
        if (exportAudio && exportAudio.track) {
            streamTracks.push(exportAudio.track);
        }
        const stream = new MediaStream(streamTracks);
        const chunks = [];

        const recordingFinished = new Promise((resolve, reject) => {
            const recorder = new MediaRecorder(stream, {
                mimeType,
                videoBitsPerSecond: 8_000_000
            });
            const resolvedMimeType = recorder.mimeType || mimeType;

            recorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) chunks.push(event.data);
            };
            recorder.onerror = (event) => {
                reject(event.error || new Error('Unknown MediaRecorder error.'));
            };
            recorder.onstop = () => {
                resolve({
                    blob: new Blob(chunks, { type: resolvedMimeType }),
                    mimeType: resolvedMimeType
                });
            };

            (async () => {
                try {
                    recorder.start();
                    for (let i = 0; i < frames.length; i++) {
                        loadFrameToDisplay(i);
                        await waitForNextPaint();
                        await drawMainDisplayToCanvas(ctx, width, height);
                        const frame = frames[i];
                        const durationMs = getFrameDurationMs(frame);
                        await wait(durationMs);
                    }
                    recorder.stop();
                } catch (error) {
                    if (recorder.state !== 'inactive') recorder.stop();
                    reject(error);
                }
            })();
        });

        try {
            const { blob: videoBlob, mimeType: outputMimeType } = await recordingFinished;
            const extension = getFileExtensionFromMimeType(outputMimeType);
            const downloadUrl = URL.createObjectURL(videoBlob);
            const downloadLink = document.createElement('a');
            downloadLink.href = downloadUrl;
            downloadLink.download = `animation.${extension}`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            downloadLink.remove();
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1500);
            if (extension !== 'mp4') {
                alert('Current browser exported WebM format. For MP4 export, please use Safari.');
            }
        } catch (error) {
            alert(`Export failed: ${error.message}`);
        } finally {
            stream.getTracks().forEach((track) => track.stop());
            if (exportAudio && exportAudio.cleanup) {
                await exportAudio.cleanup();
            }
            if (frames.length > 0) {
                loadFrameToDisplay(0);
            }
            isExportingVideo = false;
            btnDownload.innerText = originalButtonText;
            updatePreviewControlState();
        }
    }

    function playNextFrame() {
        if (!isPlaying) return;
        
        loadFrameToDisplay(currentFrameIndex);
        const currentFrame = frames[currentFrameIndex];
        const durationMs = currentFrame.duration * 1000;
        playBeeperForFrame(currentFrame);
        
        playTimeout = setTimeout(() => {
            currentFrameIndex++;
            if (currentFrameIndex >= frames.length) {
                currentFrameIndex = 0; // 循環播放
            }
            playNextFrame();
        }, durationMs);
    }

    btnPlayPause.addEventListener('click', () => {
        if (frames.length === 0) return;
        if (isPlaying) {
            // 執行暫停
            isPlaying = false;
            clearTimeout(playTimeout);
            stopBeeper();
            btnPlayPause.innerText = "▶";
            btnPlayPause.style.backgroundColor = "var(--primary)";
        } else {
            // 執行播放
            isPlaying = true;
            btnPlayPause.innerText = "⏸";
            btnPlayPause.style.backgroundColor = "#FF9800"; // 變成橘色
            playNextFrame();
        }
    });

    btnStop.addEventListener('click', stopPlayback);
    btnDownload.addEventListener('click', exportAnimationVideo);

    function stopPlayback() {
        isPlaying = false;
        clearTimeout(playTimeout);
        stopBeeper();
        currentFrameIndex = 0;
        btnPlayPause.innerText = "▶";
        btnPlayPause.style.backgroundColor = "var(--primary)";
        if(frames.length > 0) loadFrameToDisplay(0);
        updatePreviewControlState();
    }

    function ensureAudioContext() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        if (!audioContext) {
            audioContext = new AudioCtx();
        }
        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }
        return true;
    }

    function stopBeeper() {
        clearTimeout(beeperStopTimeout);
        beeperStopTimeout = null;

        if (beeperOscillator) {
            try {
                beeperOscillator.stop();
            } catch (error) {
                // Oscillator may already be stopped.
            }
            beeperOscillator.disconnect();
            beeperOscillator = null;
        }

        if (beeperGainNode) {
            beeperGainNode.disconnect();
            beeperGainNode = null;
        }
    }

    function playBeeperForFrame(frame) {
        stopBeeper();
        if (!frame || !frame.beeper) return;

        if (!ensureAudioContext()) return;
        const durationMs = Math.max(0, frame.duration * 1000);
        if (durationMs === 0) return;

        beeperOscillator = audioContext.createOscillator();
        beeperGainNode = audioContext.createGain();
        beeperOscillator.type = 'square';
        beeperOscillator.frequency.value = 3000;
        beeperGainNode.gain.value = 0.08;
        beeperOscillator.connect(beeperGainNode);
        beeperGainNode.connect(audioContext.destination);
        beeperOscillator.start();

        beeperStopTimeout = setTimeout(() => {
            stopBeeper();
        }, durationMs);
    }

    // 初始渲染
    renderMainDisplay();
    renderTimeline();
    updatePreviewControlState();

</script>
</body>
</html>
